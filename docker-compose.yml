services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /ara/src/persistence
    env_file:
      - .env
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    networks:
      - external-net

  arabot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    volumes:
      - ara_data:/ara/src/persistence/states
    networks:
      - external-net

networks:
  external-net:
    external: true

volumes:
  ara_data:
    name: ara_data