services:

  arabot:
    image: arabot:latest
    build: .
    restart: unless-stopped
    container_name: arabot
    volumes:
      - ara_data_dev:/ara/src/persistence/states
    env_file:
      - .env
    environment:
      - DATABASE_URL
      - BOT_TOKEN
      - BOT_URL
      - AI_TOKEN
      - AI_URL
      - AI_MODEL
      - TIMEZONE
      - CALENDAR
      - BOT_PERSISTENCE_URL
    networks:
      - external-net


networks:
  external-net:
    external: true


volumes:
  ara_data_dev:
