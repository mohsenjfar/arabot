services:
  arabot-mig:
    build:
      context: .
      dockerfile: Dockerfile
    image: arabot:mig
    working_dir: /ara/src/persistence
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    networks:
      - external-net

  arabot-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: arabot:dev
    container_name: arabot-dev
    restart: always
    volumes:
      - ara_data:/ara/src/persistence/states
    networks:
      - external-net

  arabot-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: arabot:prod
    container_name: arabot-prod
    restart: always
    volumes:
      - ara_data:/ara/src/persistence/states
    networks:
      - external-net

networks:
  external-net:
    external: true

volumes:
  ara_data:
    name: ara_data