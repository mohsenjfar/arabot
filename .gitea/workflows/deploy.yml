name: Deploy arabot

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        run: |
          git init
          git remote add origin https://mohsen:@git.archiq.ir/mohsen/arabot.git
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}

      - name: Install Docker Compose
        run: |
          docker --version
          apk add --no-cache docker-compose || apt-get update && apt-get install -y docker-compose

      - name: Deploy with Docker Compose
        env:
            DOCKER_HOST: tcp://socket-proxy:2375
        run: |
          docker-compose up -d --build
