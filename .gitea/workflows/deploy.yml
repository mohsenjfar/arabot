name: Deploy arabot with Docker Compose

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout arabot code
        uses: actions/checkout@v4
        with:
          repository: mohsen/arabot
          token: ${{ secrets.GITEA_TOKEN }}
          ref: ${{ gitea.ref_name }}
          fetch-depth: 1

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          cd /path/to/your/deploy/repo-or-folder
          docker-compose down -v || true
          docker-compose up -d --build