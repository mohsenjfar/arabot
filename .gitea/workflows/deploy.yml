name: Deploy arabot

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ara

    env:
      BRANCH: ${{ github.ref_name }}

      DATABASE_URL_DEV: ${{ secrets.DATABASE_URL_DEV }}
      DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}

      BOT_TOKEN_DEV: ${{ secrets.BOT_TOKEN_DEV }}
      BOT_TOKEN_PROD: ${{ secrets.BOT_TOKEN_PROD }}

      AI_TOKEN: ${{ secrets.AI_TOKEN }}

      BOT_URL: ${{ vars.BOT_URL }}
      AI_URL: ${{ vars.AI_URL }}

      AI_MODEL_DEV: ${{ vars.AI_MODEL_DEV }}
      AI_MODEL_PROD: ${{ vars.AI_MODEL_PROD }}

      TIMEZONE: ${{ vars.TIMEZONE }}
      CALENDAR: ${{ vars.CALENDAR }}

      BOT_PERSISTENCE_DEV: ${{ vars.BOT_PERSISTENCE_PATH_DEV }}
      BOT_PERSISTENCE_PROD: ${{ vars.BOT_PERSISTENCE_PATH_PROD }}

    steps:

      - name: 1️⃣ Checkout Source
        shell: bash
        run: |
          set -e
          REPO_URL="ssh://git@87.248.139.251:2222/ARACOM/ara.git"

          rm -rf repo
          git clone --depth 1 --branch "$BRANCH" "$REPO_URL" repo

      - name: 2️⃣ Select Environment
        shell: bash
        run: |
          set -e

          if [ "$BRANCH" = "development" ]; then
            echo "DATABASE_URL=$DATABASE_URL_DEV" >> $GITHUB_ENV
            echo "BOT_TOKEN=$BOT_TOKEN_DEV" >> $GITHUB_ENV
            echo "AI_MODEL=$AI_MODEL_DEV" >> $GITHUB_ENV
            echo "BOT_PERSISTENCE_URL=$BOT_PERSISTENCE_DEV" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "SERVICE=arabot-dev" >> $GITHUB_ENV

          elif [ "$BRANCH" = "main" ]; then
            echo "DATABASE_URL=$DATABASE_URL_PROD" >> $GITHUB_ENV
            echo "BOT_TOKEN=$BOT_TOKEN_PROD" >> $GITHUB_ENV
            echo "AI_MODEL=$AI_MODEL_PROD" >> $GITHUB_ENV
            echo "BOT_PERSISTENCE_URL=$BOT_PERSISTENCE_PROD" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "SERVICE=arabot-prod" >> $GITHUB_ENV

          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi

      - name: 3️⃣ Build Docker Image
        shell: bash
        run: |
          set -e
          cd repo
          docker build -t arabot:$IMAGE_TAG .

      - name: 4️⃣ Run Database Migrations
        shell: bash
        run: |
          set -e
          cd repo
          docker compose run --rm arabot-mig

      - name: 5️⃣ Start Application Container
        shell: bash
        run: |
          set -e
          cd repo
          docker compose up -d $SERVICE

      - name: 6️⃣ Cleanup Workspace
        shell: bash
        run: |
          set -e
          cd repo
          git clean -fdx || true
