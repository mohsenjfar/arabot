name: Deploy arabot with Docker Compose (Host)

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout on server and deploy
        shell: bash
        run: |
          set -e

          REPO_URL="http://git.archiq.ir/mohsen/arabot.git"
          BRANCH="${GITEA_REF_NAME:-${{ gitea.ref_name }}}"
          TARGET="/root/taskbot/${BRANCH}"

          mkdir -p /root/taskbot

          if [ ! -d "$TARGET/.git" ]; then
            rm -rf "$TARGET"
            git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$TARGET"
          else
            cd "$TARGET"
            git fetch --prune origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
          fi

          cd "$TARGET"

          docker-compose down -v || true
          docker-compose up -d --build
