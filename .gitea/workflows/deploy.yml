name: Deploy arabot

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        run: |
          git init
          git remote add origin https://mohsen:@git.archiq.ir/mohsen/arabot.git
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}

      - name: Deploy with Docker Compose
        run: |
          docker-compose up -d --build
