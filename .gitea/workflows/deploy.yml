name: Deploy arabot (Temp Workspace & Clean)

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ara
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build and Run Docker Containers
        shell: bash
        run: |
          set -e
          
          export COMPOSE_PROJECT_NAME="arabot-${{ gitea.ref_name }}"
          
          echo "Stopping old containers for $COMPOSE_PROJECT_NAME..."
          docker-compose down -v || true
          
          echo "Building and starting new containers..."
          docker-compose up -d --build

      - name: Cleanup Source Code
        shell: bash
        if: always()
        run: |
          echo "Cleaning up temporary source files..."
          git clean -fdx || true
