name: Deploy arabot (Direct Clone)

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: ara
    steps:
      - name: Checkout and Deploy
        shell: bash
        env:
          ACCESS_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -e
          
          REPO_URL="https://oauth2:${ACCESS_TOKEN}@git.aracom.ir/ARACOM/arabot.git"
          BRANCH="${{ gitea.ref_name }}"
          
          echo "Cloning branch: $BRANCH"
          git clone --depth 1 --branch "$BRANCH" "$REPO_URL" .

          export COMPOSE_PROJECT_NAME="arabot-${BRANCH}"
          
          echo "Deploying..."
          docker-compose down -v || true
          docker-compose up -d --build

          git clean -fdx || true
