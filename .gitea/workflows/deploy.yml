name: Deploy arabot with Docker Compose (Host)

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout on server and deploy
        shell: bash
        run: |
          set -e

          ssh -p 9011 -o StrictHostKeyChecking=no root@87.248.139.251 bash -s << 'EOF'
            set -e
            BRANCH="${{ gitea.ref_name }}"
            TARGET="/root/taskbot/${BRANCH}"
            REPO_URL="http://git.archiq.ir/mohsen/arabot.git"
            
            mkdir -p /root/taskbot

            git config --global credential.helper store
            echo "http://${{ secrets.USERNAME }}:${{ secrets.TOKEN }}@git.archiq.ir" > ~/.git-credentials
            chmod 600 ~/.git-credentials

            if [ ! -d "$TARGET/.git" ]; then
              echo "Cloning repository on server..."
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" "$TARGET"
            else
              echo "Updating existing repository on server..."
              cd "$TARGET"
              git fetch --prune origin
              git checkout "$BRANCH"
              git pull --ff-only origin "$BRANCH"
            fi

            cd "$TARGET"
            echo "Deploying with Docker Compose on server..."
            docker-compose down -v || true
            docker-compose up -d --build
          EOF
